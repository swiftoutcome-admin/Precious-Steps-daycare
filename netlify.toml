[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Security headers
#
# The CSP below is deliberately strict and assumes NO inline <script> or
# <style> anywhere in the output, and no third-party embeds. If a future
# change needs a Google Maps iframe, a YouTube embed, or an analytics tag,
# add the matching source here rather than loosening the policy wholesale.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # frame-src google.com is the single third-party exception, present only
    # to embed the location maps. Nothing else may be framed. If the maps are
    # swapped for OpenStreetMap, narrow this to openstreetmap.org.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.google.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
